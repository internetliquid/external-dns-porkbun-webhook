name: Release

# Runs on every push to develop. release-please maintains a "Release PR"
# (version + changelog from Conventional Commits); merging that PR creates the
# tag + GitHub Release. The remaining steps run in the SAME job only when a
# release was just created.
on:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        with:
          client-id: ${{ secrets.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Release please
        id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: develop
          token: ${{ steps.app-token.outputs.token }}

      # --- Everything below runs only on an actual release ---

      - name: Checkout release commit
        if: ${{ steps.rp.outputs.release_created }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up Go
        if: ${{ steps.rp.outputs.release_created }}
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      - name: Log in to GHCR
        if: ${{ steps.rp.outputs.release_created }}
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        if: ${{ steps.rp.outputs.release_created }}
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Promote: fast-forward main to the released commit so main always tracks
      # the latest release. Requires main's branch protection to allow this push
      # (or a PAT); see the README.
      - name: Fast-forward main to the release
        if: ${{ steps.rp.outputs.release_created }}
        env:
          RELEASE_SHA: ${{ steps.rp.outputs.sha }}
        run: git push origin "${RELEASE_SHA}:refs/heads/main"
